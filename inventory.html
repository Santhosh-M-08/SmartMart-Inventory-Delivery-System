<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Management — SmartMart</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <!-- Shared stylesheet owned by Member 3: change this path to match the repo (it is safe if missing). -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/inventory.css">
</head>
<body>
<div class="inv-shell">

<!-- SIDEBAR (same look as Orders & Delivery). Change the three href values to your friends' real file names. -->
<aside class="inv-sidebar" aria-label="Main navigation">
  <a class="inv-sb-brand" href="dashboard.html"><span class="inv-sb-logo">S</span><span>SmartMart</span></a>
  <div class="inv-sb-label">MAIN MENU</div>
  <nav class="inv-sb-nav">
    <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Dashboard</a>
    <a href="inventory.html" class="is-active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 9h16M4 15h16"/></svg>Inventory</a>
    <a href="delivery.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>Orders &amp; Delivery</a>
  </nav>
  <div class="inv-sb-user"><span class="inv-sb-avatar">SM</span><span><strong>Store Manager</strong><small>SmartMart Admin</small></span></div>
</aside>

<div class="inv-content">
<main class="inv" id="inventoryModule">

  <header class="inv-head">
    <div>
      <h1>Inventory Management</h1>
      <p>View, search and update products and stock levels.</p>
    </div>
    <button type="button" class="inv-btn inv-btn--primary" id="addBtn">+ Add product</button>
  </header>

  <section class="inv-stats" aria-label="Inventory summary">
    <div class="inv-stat"><span>Total products</span><strong id="statProducts">0</strong></div>
    <div class="inv-stat"><span>Units in stock</span><strong id="statUnits">0</strong></div>
    <div class="inv-stat"><span>Low / out of stock</span><strong id="statLow">0</strong></div>
    <div class="inv-stat"><span>Stock value</span><strong id="statValue">₹0</strong></div>
  </section>

  <div class="inv-banner" id="lowBanner" role="alert" hidden>
    <span id="lowBannerText"></span>
    <button type="button" class="inv-btn inv-btn--small" id="lowToggle">Show only low stock</button>
  </div>

  <section class="inv-card">
    <div class="inv-toolbar">
      <div class="inv-field inv-field--grow">
        <label for="searchInput">Search by name</label>
        <input id="searchInput" type="search" placeholder="e.g. Rice, Milk…" autocomplete="off">
      </div>
      <div class="inv-field">
        <label for="categoryFilter">Category</label>
        <select id="categoryFilter"></select>
      </div>
      <div class="inv-field inv-field--narrow">
        <label for="thresholdInput">Low-stock at ≤</label>
        <input id="thresholdInput" type="number" min="1" max="1000" step="1">
      </div>
      <button type="button" class="inv-btn" id="clearBtn">Clear filters</button>
    </div>

    <div class="inv-table-wrap">
      <table class="inv-table">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th><th>Status</th><th class="actions">Actions</th></tr>
        </thead>
        <tbody id="productRows"></tbody>
      </table>
    </div>

    <div class="inv-empty" id="emptyState" hidden>
      <h2 id="emptyTitle"></h2>
      <p id="emptyText"></p>
      <button type="button" class="inv-btn inv-btn--primary" id="emptyAction"></button>
    </div>
  </section>
</main>
</div><!-- /inv-content -->
</div><!-- /inv-shell -->

<dialog class="inv-dialog" id="productDialog" aria-labelledby="dialogTitle">
  <form id="productForm" novalidate>
    <h2 id="dialogTitle">Add product</h2>
    <input type="hidden" id="fId">

    <div class="inv-field">
      <label for="fName">Product name *</label>
      <input id="fName" maxlength="60" autocomplete="off">
      <small class="inv-error" id="eName"></small>
    </div>
    <div class="inv-field">
      <label for="fCategory">Category *</label>
      <input id="fCategory" list="categoryList" maxlength="40" autocomplete="off" placeholder="Select or type a new category">
      <datalist id="categoryList"></datalist>
      <small class="inv-error" id="eCategory"></small>
    </div>
    <div class="inv-row">
      <div class="inv-field">
        <label for="fPrice">Price (₹) *</label>
        <input id="fPrice" type="number" min="0" step="0.01" inputmode="decimal">
        <small class="inv-error" id="ePrice"></small>
      </div>
      <div class="inv-field">
        <label for="fStock">Stock quantity *</label>
        <input id="fStock" type="number" min="0" step="1" inputmode="numeric">
        <small class="inv-error" id="eStock"></small>
      </div>
    </div>

    <div class="inv-dialog-actions">
      <button type="button" class="inv-btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="inv-btn inv-btn--primary" id="saveBtn">Save product</button>
    </div>
  </form>
</dialog>

<div class="inv-toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/inventory.js"></script>
</body>
</html>
